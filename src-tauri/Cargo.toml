[package]
name = "magic-resume"
version = "2.0.11"
description = "Magic Resume desktop application"
authors = ["Magic Resume"]
edition = "2021"
rust-version = "1.77.2"

# The desktop shell is a thin Tauri v2 host around the client-only web bundle.
[lib]
name = "magic_resume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
